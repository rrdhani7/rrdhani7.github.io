<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 204" preserveAspectRatio="xMaxYMid slice" aria-hidden="true">
  <style>
    .box { fill: #fff; stroke: #c3d3bf; stroke-width: 1.2; }
    .row { fill: #e3ede0; }
    .hub { fill: #2b4539; }
    .line { stroke: #c3d3bf; stroke-width: 1.2; stroke-dasharray: 2 3; }
    .hit { fill: none; stroke: #2f8f5b; stroke-width: 1.6; opacity: 0; animation: hit 6s infinite; }
    .ck { opacity: 0; transform-box: fill-box; transform-origin: center; }
    .tick { fill: none; stroke: #fff; stroke-width: 1.1; stroke-linecap: round; stroke-linejoin: round; }
    .rq { fill: #2b4539; opacity: 0; animation: req 6s infinite; }
    .rs { fill: #2f8f5b; opacity: 0; animation: res 6s infinite; }
    .c1 { animation: ck1 6s infinite; }
    .c2 { animation: ck2 6s infinite; }
    .c3 { animation: ck3 6s infinite; }
    @keyframes req { 0%, 8% { transform: translateX(0); opacity: 0 } 11% { opacity: 1 } 24% { transform: translateX(60px); opacity: 1 } 26%, 100% { transform: translateX(60px); opacity: 0 } }
    @keyframes res { 0%, 30% { transform: translateX(0); opacity: 0 } 33% { opacity: 1 } 46% { transform: translateX(-60px); opacity: 1 } 48%, 100% { transform: translateX(-60px); opacity: 0 } }
    @keyframes hit { 0%, 24% { opacity: 0 } 27%, 33% { opacity: 1 } 37%, 100% { opacity: 0 } }
    @keyframes ck1 { 0%, 50% { opacity: 0; transform: scale(.4) } 54%, 93% { opacity: 1; transform: scale(1) } 97%, 100% { opacity: 0; transform: scale(1) } }
    @keyframes ck2 { 0%, 56% { opacity: 0; transform: scale(.4) } 60%, 93% { opacity: 1; transform: scale(1) } 97%, 100% { opacity: 0; transform: scale(1) } }
    @keyframes ck3 { 0%, 62% { opacity: 0; transform: scale(.4) } 66%, 93% { opacity: 1; transform: scale(1) } 97%, 100% { opacity: 0; transform: scale(1) } }
    @media (prefers-reduced-motion: reduce) {
      .rq, .rs, .hit, .ck { animation: none; }
      .ck { opacity: 1; }
    }
  </style>
  <rect x="160" y="50" width="52" height="56" rx="6" class="box"/>
  <rect x="168" y="62" width="36" height="8" rx="2.5" class="row"/>
  <g class="ck c1"><circle cx="196" cy="66" r="3.6" fill="#3f7d6b"/><path d="M194.3 66.2 L195.6 67.5 L198 64.6" class="tick"/></g>
  <rect x="168" y="74" width="36" height="8" rx="2.5" class="row"/>
  <g class="ck c2"><circle cx="196" cy="78" r="3.6" fill="#3f7d6b"/><path d="M194.3 78.2 L195.6 79.5 L198 76.6" class="tick"/></g>
  <rect x="168" y="86" width="36" height="8" rx="2.5" class="row"/>
  <g class="ck c3"><circle cx="196" cy="90" r="3.6" fill="#3f7d6b"/><path d="M194.3 90.2 L195.6 91.5 L198 88.6" class="tick"/></g>
  <rect x="280" y="66" width="46" height="24" rx="6" class="hub"/>
  <rect x="280" y="66" width="46" height="24" rx="6" class="hit"/>
  <line x1="212" y1="74" x2="280" y2="74" class="line"/>
  <line x1="212" y1="84" x2="280" y2="84" class="line"/>
  <circle cx="220" cy="74" r="2.8" class="rq" style="transform:none"/>
  <circle cx="272" cy="84" r="2.8" class="rs"/>
</svg>
