<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 204" preserveAspectRatio="xMaxYMid slice" aria-hidden="true">
  <style>
    .box { fill: #fff; stroke: #b9c7d3; stroke-width: 1.2; }
    .hub { fill: #284057; }
    .line { stroke: #b9c7d3; stroke-width: 1.2; stroke-dasharray: 2 3; fill: none; }
    .track { fill: #d3dde6; }
    .bar { fill: #3f7d6b; transform-box: fill-box; transform-origin: left center; transform: scaleX(0); }
    .dot { fill: #284057; opacity: 0; }
    .a { animation: toHub 5s infinite; }
    .a2 { animation-delay: .15s; }
    .a3 { animation-delay: .3s; }
    .n1 { animation: toN1 5s infinite; }
    .n2 { animation: toN2 5s infinite; }
    .n3 { animation: toN3 5s infinite; }
    .b1 { animation: fill1 5s infinite; }
    .b2 { animation: fill2 5s infinite; }
    .b3 { animation: fill3 5s infinite; }
    @keyframes toHub { 0% { transform: translate(0,0); opacity: 0 } 4% { opacity: 1 } 20% { transform: translate(40px,0); opacity: 1 } 23%, 100% { transform: translate(40px,0); opacity: 0 } }
    @keyframes toN1 { 0%, 26% { transform: translate(0,0); opacity: 0 } 28% { opacity: 1 } 42% { transform: translate(52px,-38px); opacity: 1 } 45%, 100% { transform: translate(52px,-38px); opacity: 0 } }
    @keyframes toN2 { 0%, 26% { transform: translate(0,0); opacity: 0 } 28% { opacity: 1 } 42% { transform: translate(52px,0); opacity: 1 } 45%, 100% { transform: translate(52px,0); opacity: 0 } }
    @keyframes toN3 { 0%, 26% { transform: translate(0,0); opacity: 0 } 28% { opacity: 1 } 42% { transform: translate(52px,38px); opacity: 1 } 45%, 100% { transform: translate(52px,38px); opacity: 0 } }
    @keyframes fill1 { 0%, 44% { transform: scaleX(0) } 78%, 94% { transform: scaleX(1) } 100% { transform: scaleX(0) } }
    @keyframes fill2 { 0%, 44% { transform: scaleX(0) } 88%, 94% { transform: scaleX(1) } 100% { transform: scaleX(0) } }
    @keyframes fill3 { 0%, 44% { transform: scaleX(0) } 83%, 94% { transform: scaleX(1) } 100% { transform: scaleX(0) } }
    @media (prefers-reduced-motion: reduce) {
      .a, .n1, .n2, .n3, .b1, .b2, .b3 { animation: none; }
      .bar { transform: scaleX(1); }
    }
  </style>
  <rect x="148" y="66" width="32" height="48" rx="5" class="box"/>
  <rect x="155" y="76" width="18" height="5" rx="2.5" class="track"/>
  <rect x="155" y="88" width="18" height="5" rx="2.5" class="track"/>
  <rect x="155" y="100" width="18" height="5" rx="2.5" class="track"/>
  <path class="line" d="M180 90 H220"/>
  <rect x="220" y="76" width="28" height="28" rx="6" class="hub"/>
  <path class="line" d="M248 90 C264 90 264 52 280 52"/>
  <path class="line" d="M248 90 H280"/>
  <path class="line" d="M248 90 C264 90 264 128 280 128"/>
  <rect x="280" y="40" width="64" height="24" rx="5" class="box"/>
  <rect x="288" y="49" width="48" height="6" rx="3" class="track"/>
  <rect x="288" y="49" width="48" height="6" rx="3" class="bar b1"/>
  <rect x="280" y="78" width="64" height="24" rx="5" class="box"/>
  <rect x="288" y="87" width="48" height="6" rx="3" class="track"/>
  <rect x="288" y="87" width="48" height="6" rx="3" class="bar b2"/>
  <rect x="280" y="116" width="64" height="24" rx="5" class="box"/>
  <rect x="288" y="125" width="48" height="6" rx="3" class="track"/>
  <rect x="288" y="125" width="48" height="6" rx="3" class="bar b3"/>
  <circle cx="180" cy="90" r="3.5" class="dot a"/>
  <circle cx="180" cy="90" r="3.5" class="dot a a2"/>
  <circle cx="180" cy="90" r="3.5" class="dot a a3"/>
  <circle cx="248" cy="90" r="3.5" class="dot n1"/>
  <circle cx="248" cy="90" r="3.5" class="dot n2"/>
  <circle cx="248" cy="90" r="3.5" class="dot n3"/>
</svg>
