<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 204" preserveAspectRatio="xMaxYMid slice" aria-hidden="true">
  <style>
    .box { fill: #fff; stroke: #dccbc4; stroke-width: 1.2; }
    .on { fill: #f6ebe6; stroke: #573a37; stroke-width: 1.2; opacity: 0; }
    .ck { opacity: 0; }
    .tick { fill: none; stroke: #fff; stroke-width: 1.2; stroke-linecap: round; stroke-linejoin: round; opacity: 0; }
    .track { stroke: #dccbc4; stroke-width: 1.2; stroke-dasharray: 2 3; }
    .tok { animation: move 8s infinite; }
    .tok-c { fill: #573a37; }
    .tok-t { fill: #fff; font: 600 6.5px -apple-system, "Helvetica Neue", Arial, sans-serif; }
    .s1 { animation: on1 8s infinite; }
    .s1c { animation: ck1 8s infinite; }
    .s2 { animation: on2 8s infinite; }
    .s2c { animation: ck2 8s infinite; }
    .s3 { animation: on3 8s infinite; }
    .s3c { animation: ck3 8s infinite; }
    .s4 { animation: on4 8s infinite; }
    .s4c { animation: ck4 8s infinite; }
    @keyframes move {
      0%, 24% { transform: translateX(0); opacity: 1 }
      28%, 49% { transform: translateX(44px) }
      53%, 74% { transform: translateX(88px) }
      78%, 93% { transform: translateX(132px); opacity: 1 }
      97%, 100% { transform: translateX(132px); opacity: 0 }
    }
    @keyframes on1 { 0%, 2% { opacity: 0 } 5%, 93% { opacity: 1 } 97%, 100% { opacity: 0 } }
    @keyframes ck1 { 0%, 4% { opacity: 0 } 7%, 93% { opacity: 1 } 97%, 100% { opacity: 0 } }
    @keyframes on2 { 0%, 28% { opacity: 0 } 31%, 93% { opacity: 1 } 97%, 100% { opacity: 0 } }
    @keyframes ck2 { 0%, 30% { opacity: 0 } 33%, 93% { opacity: 1 } 97%, 100% { opacity: 0 } }
    @keyframes on3 { 0%, 53% { opacity: 0 } 56%, 93% { opacity: 1 } 97%, 100% { opacity: 0 } }
    @keyframes ck3 { 0%, 55% { opacity: 0 } 58%, 93% { opacity: 1 } 97%, 100% { opacity: 0 } }
    @keyframes on4 { 0%, 78% { opacity: 0 } 81%, 93% { opacity: 1 } 97%, 100% { opacity: 0 } }
    @keyframes ck4 { 0%, 80% { opacity: 0 } 83%, 93% { opacity: 1 } 97%, 100% { opacity: 0 } }
    @media (prefers-reduced-motion: reduce) {
      .tok, .on, .ck, .tick { animation: none; }
      .on, .ck, .tick { opacity: 1; }
      .tok { transform: translateX(132px); }
    }
  </style>
  <line x1="177" y1="62" x2="309" y2="62" class="track"/>
  <rect x="160" y="76" width="34" height="24" rx="5" class="box"/>
  <rect x="160" y="76" width="34" height="24" rx="5" class="on s1"/>
  <circle cx="177" cy="88" r="5.5" fill="#3f7d6b" class="ck s1c"/>
  <path d="M174.3 88.3 L176.3 90.3 L179.8 85.8" class="tick s1c"/>
  <rect x="204" y="76" width="34" height="24" rx="5" class="box"/>
  <rect x="204" y="76" width="34" height="24" rx="5" class="on s2"/>
  <circle cx="221" cy="88" r="5.5" fill="#3f7d6b" class="ck s2c"/>
  <path d="M218.3 88.3 L220.3 90.3 L223.8 85.8" class="tick s2c"/>
  <rect x="248" y="76" width="34" height="24" rx="5" class="box"/>
  <rect x="248" y="76" width="34" height="24" rx="5" class="on s3"/>
  <circle cx="265" cy="88" r="5.5" fill="#3f7d6b" class="ck s3c"/>
  <path d="M262.3 88.3 L264.3 90.3 L267.8 85.8" class="tick s3c"/>
  <rect x="292" y="76" width="34" height="24" rx="5" class="box"/>
  <rect x="292" y="76" width="34" height="24" rx="5" class="on s4"/>
  <circle cx="309" cy="88" r="5.5" fill="#3f7d6b" class="ck s4c"/>
  <path d="M306.3 88.3 L308.3 90.3 L311.8 85.8" class="tick s4c"/>
  <g class="tok">
    <circle cx="177" cy="62" r="8" class="tok-c"/>
    <text x="177" y="64.3" text-anchor="middle" class="tok-t">QA</text>
  </g>
</svg>
