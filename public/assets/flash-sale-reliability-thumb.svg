<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 204" preserveAspectRatio="xMaxYMid slice" aria-hidden="true">
  <style>
    .axis { stroke: #c4d6bd; stroke-width: 1; }
    .thr { stroke: #7fa58c; stroke-width: 1; stroke-dasharray: 3 3; }
    .mark { stroke: #9bb59f; stroke-width: 1; stroke-dasharray: 2 3; opacity: 0; animation: mark 6s infinite; }
    .traffic, .resp { fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 100; stroke-dashoffset: 100; }
    .traffic { stroke: #c2603a; animation: draw 6s infinite; }
    .resp { stroke: #20452c; animation: draw 6s infinite; }
    .box { fill: #fff; stroke: #bcd0b5; stroke-width: 1.2; }
    .pulse { fill: #2f8f5b; transform-box: fill-box; transform-origin: center; animation: pulse 1.4s ease-in-out infinite; }
    .tick { fill: none; stroke: #fff; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
    @keyframes draw { 0% { stroke-dashoffset: 100; opacity: 1 } 62%, 92% { stroke-dashoffset: 0; opacity: 1 } 97%, 100% { stroke-dashoffset: 0; opacity: 0 } }
    @keyframes mark { 0%, 36% { opacity: 0 } 40%, 92% { opacity: .9 } 97%, 100% { opacity: 0 } }
    @keyframes pulse { 0%, 100% { transform: scale(1) } 50% { transform: scale(1.18) } }
    @media (prefers-reduced-motion: reduce) {
      .traffic, .resp { animation: none; stroke-dashoffset: 0; }
      .mark { animation: none; opacity: .9; }
      .pulse { animation: none; }
    }
  </style>
  <line x1="150" y1="64" x2="290" y2="64" class="axis"/>
  <path class="traffic" pathLength="100" d="M150 60 L190 58 L212 55 C218 42 222 34 232 31 L260 29 L290 27"/>
  <line x1="150" y1="112" x2="290" y2="112" class="axis"/>
  <line x1="150" y1="90" x2="290" y2="90" class="thr"/>
  <path class="resp" pathLength="100" d="M150 106 L190 105 L212 104 C218 100 222 97 232 97 L260 99 L290 100"/>
  <line x1="214" y1="22" x2="214" y2="114" class="mark"/>
  <rect x="304" y="42" width="42" height="54" rx="8" class="box"/>
  <circle cx="325" cy="69" r="11" fill="#2f8f5b" class="pulse"/>
  <path d="M319.5 69.5 L323.5 73.5 L331 65" class="tick"/>
</svg>
